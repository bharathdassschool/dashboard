# Every hour: are the live sites up, and can the portal reach its database and the office and leave apps?
# If anything is down this run fails and GitHub emails the repository owner.
name: Live health check
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Portal, database and both apps
        run: |
          set -e
          check() { code=$(curl -s -o /tmp/body -w "%{http_code}" --max-time 30 "$1"); echo "$1 -> $code"; [ "$code" = "200" ] || { cat /tmp/body; exit 1; }; }
          check https://bharathdass-portal.vercel.app/login
          check https://bharathdass-internal-rara.vercel.app/login
          check https://bharathdass-leave-system.vercel.app/login
          check https://bharathdass-portal.vercel.app/api/health
          cat /tmp/body
